<!doctype html>
<html lang="en" data-look="pixelite">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The browser chrome's colour — iOS Safari's bars and the area behind the Dynamic
		     Island, Android Chrome's bar. $lib/theme-color keeps it matched to whatever the
		     SUPERBAR currently is, by measuring the top edge of the page.
		     This value is only the pre-paint seed, so the chrome does not flash the wrong colour
		     before that runs: the phone's docs bar at rest, which is --sheet-stock. The script
		     below corrects it for a dark scheme, for the same reason it stamps data-theme there
		     rather than waiting for hydration. -->
		<meta name="theme-color" content="#ffffff" />
		<!-- PRE-PAINT, in a file of its own: see static/preflight.js for why it is not inline.
		     Blocking on purpose — it has to stamp <html> before the first frame. -->
		<script src="%sveltekit.assets%/preflight.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
