<!doctype html>
<html lang="en" data-ui="bubble">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply a saved theme + display-mode override + time-of-day sky + button style before paint.
			try {
				// Named theme (Lab is the default and carries no attribute; Metro opts in).
				if (localStorage.getItem('ksh-look') === 'metro')
					document.documentElement.dataset.look = 'metro';
				var t = localStorage.getItem('ksh-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				// Bubble is the DEFAULT button style — the attribute ships on <html> itself so even
				// a no-JS load gets it; only a saved 'flat' strips it.
				if (localStorage.getItem('ksh-ui') === 'flat')
					document.documentElement.removeAttribute('data-ui');
				// Auto is the DEFAULT sky: a visitor who has never chosen (null) gets the time-of-day
				// phase, same as an explicit 'auto'. Only 'off' opts out to a solid background. This
				// runs pre-paint so the phase is on <html> before the first frame — the page's own
				// skyMode default must match it, or the two disagree for a beat after hydration.
				var sky = localStorage.getItem('ksh-sky');
				// Photo mode paints a picture, and NOTHING is meant to sit under it. The server can't
				// know the visitor chose it, so its HTML still carries the rings (and dark mode would
				// build the star field on top) — which flashed up behind the photo while it loaded.
				// Marking <html> here, pre-paint, lets the CSS hide that decor before its first frame;
				// the page's own skyMode is seeded from the same key, so hydration builds none of it.
				if (sky === 'photo') document.documentElement.dataset.skyPhoto = '';
				if (['dawn', 'morning', 'noon', 'dusk', 'night'].indexOf(sky) >= 0) {
					document.documentElement.dataset.sky = sky;
				} else if (sky === 'auto' || sky === null) {
					var h = new Date().getHours();
					document.documentElement.dataset.sky =
						h < 5 || h >= 21
							? 'night'
							: h < 8
								? 'dawn'
								: h < 11
									? 'morning'
									: h < 17
										? 'noon'
										: 'dusk';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
