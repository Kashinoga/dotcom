<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply a saved theme + display-mode override + time-of-day sky + button style before paint.
			try {
				// Named theme (Lab is the default and carries no attribute; Metro opts in).
				if (localStorage.getItem('ksh-look') === 'metro')
					document.documentElement.dataset.look = 'metro';
				var t = localStorage.getItem('ksh-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				if (localStorage.getItem('ksh-ui') === 'bubble') document.documentElement.dataset.ui = 'bubble';
				// Sky is opt-in now (default: a solid background, no data-sky). Apply a saved phase,
				// or compute the phase when Auto is chosen; anything else (null / 'off') stays solid.
				var sky = localStorage.getItem('ksh-sky');
				if (['dawn', 'morning', 'noon', 'dusk', 'night'].indexOf(sky) >= 0) {
					document.documentElement.dataset.sky = sky;
				} else if (sky === 'auto') {
					var h = new Date().getHours();
					document.documentElement.dataset.sky =
						h < 5 || h >= 21
							? 'night'
							: h < 8
								? 'dawn'
								: h < 11
									? 'morning'
									: h < 17
										? 'noon'
										: 'dusk';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
