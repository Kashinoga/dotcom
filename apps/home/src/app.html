<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- NO data-look, AND NO PRE-PAINT SCRIPT. The old site carried both: an attribute naming
		     one of three themes, and a blocking script that read localStorage before the first
		     frame so the saved one did not flash. There is one look now, so there is nothing to
		     save, nothing to read, and nothing to stamp. A theme that is the only theme needs no
		     switch — the CSS simply is the site.

		     The scheme still answers the reader. KDS declares `color-scheme: light dark` on :root
		     and every colour is a light-dark() pair, so the OS setting resolves it with no
		     JavaScript in the path at all. That is why the flash the old preflight.js existed to
		     prevent cannot happen here: nothing is waiting to be corrected. -->
		<meta name="color-scheme" content="light dark" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
