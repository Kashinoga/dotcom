packages:
  - apps/*
  - packages/*

# Allow the Cloudflare adapter's native deps to run their install scripts
# (pnpm 10+ blocks build scripts by default, which fails the build's deps check).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  workerd: set this to true or false
