# Continuous integration.
#
# CUT BACK WITH THE SITE. This file used to run two jobs: a fast one (format, types, unit tests,
# build, a chunk audit and a CSP check) and a slow one that installed three browser engines and ran
# the e2e suites, scoped to the diff on a pull request and run whole on main.
#
# The rebuild deleted what those gates were watching. The unit tests covered the URL layer and the
# place register; the browser suites covered sixteen panels, three themes and a text editor. None of
# that exists right now, and a gate pointed at nothing does worse than nothing — it goes green and
# reads as evidence. So each one comes back WITH the thing it protects, and the old file is in
# `_TO_MIGRATE/` (recover it from git history at 46ca5bc; it is not in the snapshot directory, which
# holds source only).
#
# What is left is what still has something to check: the code is formatted, it typechecks, and it
# builds. That is the honest floor for a site that is currently three routes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer stale. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json's packageManager field

      - uses: actions/setup-node@v4
        with:
          # The pin in .node-version is the authority. Reading it here is what keeps it honest:
          # a version nobody actually builds on is a comment, not a pin.
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting first — the cheapest gate of all, and `pnpm format` fixes every failure.
      - run: pnpm format:check

      # Then types: the gate most changes trip.
      - run: pnpm check

      # The build catches what the above cannot: an adapter that cannot bundle a route.
      - run: pnpm build
